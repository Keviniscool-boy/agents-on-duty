name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # B9 门禁：起真实 MySQL，test_mysql_store_roundtrip 必须真实执行，
    # 不允许静默 skip 计为通过。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: smart_cs
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_password"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
        env:
          REDIS_URL: redis://127.0.0.1:6399/0
          # roundtrip 用例打真实 MySQL service（B9 门禁）；
          # 降级类用例仍指向不可达端口验证进程内兜底。
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: ci_root_password
          MYSQL_DATABASE: smart_cs
          # api.main 在模块级构造 DashScopeEmbeddings，校验 key 非空；
          # 测试用 FakeLLM 驱动，不会真正调用 embedding API。
          DASHSCOPE_API_KEY: dummy-key-for-ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
